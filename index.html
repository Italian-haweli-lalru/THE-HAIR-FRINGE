function Booking(){const all=Object.values(SERVICES).flat().map(s=>s[0]);

const go=ev=>{ev.preventDefault();const x={};

if(!/^(\+?91)?[6-9]\d{9}$/.test(f.phone.replace(/[\s-]/g,"")))x.phone="Enter a valid 10-digit mobile number.";
if(!f.ok)x.ok="Please tick the consent box to continue.";if(!f.service)x.service="Select a service.";if(!f.date||f.date<today)x.date="Pick today or a later date.";if(!f.time)x.time="Pick a preferred time.";
